[project]
name = "byte-format"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bryan Harvey", email = "bryan.edward.harvey@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
extend-select = ["I", "B"]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
